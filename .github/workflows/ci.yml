name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: go fmt check
        run: |
          out=$(gofmt -l ./internal ./cmd/tool)
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi
      - name: go test
        run: go test ./... -count=1 -run Test -v
      - name: conformance tests
        run: go test ./internal/core -run TestConformance -v -count=1
      - name: build tool
        run: go build -o tool ./cmd/tool
      - name: plugin validate + test (official/community)
        run: |
          for d in plugins/official/* plugins/community/*; do
            if [ -f "$d/plugin.yaml" ]; then
              echo "== $d =="
              ./tool plugin validate "$d"
              ./tool plugin test "$d"
            fi
          done
      - name: plugin list + search
        run: |
          ./tool plugin list
          ./tool plugin search csv
          ./tool plugin search llm
      - name: pipeline validate + lint + plan (all pipelines)
        run: |
          for f in pipelines/*.yaml; do
            echo "== validate $f =="
            ./tool pipeline validate "$f"
            echo "== lint $f =="
            ./tool pipeline lint "$f"
            echo "== plan $f =="
            ./tool pipeline plan "$f"
          done
      - name: foreach + after_foreach live
        run: |
          ./tool pipeline run pipelines/csv_foreach.yaml --yes
          ./tool pipeline run pipelines/csv_foreach_summary.yaml --yes
      - name: resume live
        run: |
          ./tool pipeline run pipelines/csv_foreach.yaml --yes --runs-dir=var/runs | tail
          last=$(ls -t var/runs | head -1)
          echo "resume $last"
          ./tool runs show $last
          ./tool runs list
      - name: json store live
        run: |
          ./tool pipeline run pipelines/csv_foreach_summary.yaml --yes --store=json --db-path=var/runs/runs.db
          ./tool runs list --store=json --db-path=var/runs/runs.db
          last=$(./tool runs list --store=json --db-path=var/runs/runs.db | grep -oE '[0-9]{8}-[0-9]{6}-[a-z0-9_-]+' | head -1)
          echo "json run $last"
          ./tool runs show $last --store=json --db-path=var/runs/runs.db
      - name: schemas check
        run: |
          ls protocol/schemas/
          ls schemas/pipeline/
          cat protocol/schemas/v0.2/*.json | head -n 20
