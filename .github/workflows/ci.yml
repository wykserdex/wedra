name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
      - name: version invariants
        run: |
          set -eu
          product_version=$(tr -d '\r\n' < VERSION)
          grep -Fq "## ${product_version} " CHANGELOG.md
          protocol_version=$(tr -d '\r\n' < protocol/VERSION)
          grep -Fq "## v${protocol_version} " protocol/CHANGELOG.md
          grep -Fq "\"protocol\": \"${protocol_version}\"" conformance/manifest.json
          test -z "$(git ls-files var/runs)"
      - name: go vet
        run: go vet ./...
      - name: go mod verify
        run: go mod verify
      - name: vulnerability scan
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: go fmt check
        run: |
          out=$(gofmt -l $(find cmd internal -name '*.go' -type f))
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi
      - name: workflow lint
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/*.yml
      - name: go test
        run: go test ./... -count=1 -run Test -v -race
      - name: conformance tests
        run: go test ./internal/core/ -run 'TestPluginTest|TestExec' -v -count=1
      - name: build legacy tool
        run: go build -o tool ./cmd/tool
      - name: build wedra
        run: go build -o wedra ./cmd/wedra
      - name: plugin validate + test (official/community)
        run: |
          for d in plugins/official/* plugins/community/*; do
            if [ -f "$d/plugin.yaml" ]; then
              echo "== $d =="
              ./wedra plugin validate "$d"
              ./wedra plugin test "$d"
            fi
          done
      - name: plugin list + search
        run: |
          ./wedra plugin list
          ./wedra plugin search csv
          ./wedra plugin search llm
      - name: pipeline validate + lint + plan (all pipelines)
        run: |
          for f in examples/*.yaml; do
            echo "== validate $f =="
            ./wedra pipeline validate "$f"
            echo "== lint $f =="
            ./wedra pipeline lint "$f"
            echo "== plan $f =="
            ./wedra pipeline plan "$f"
          done
      - name: v0.20 control flow live (when, foreach-step, parallel)
        run: |
          ./wedra pipeline run examples/when_demo.yaml --yes
          ./wedra pipeline run examples/foreach_step_demo.yaml --yes
          ./wedra pipeline run examples/parallel_demo.yaml --yes
      - name: v0.22 GUI API live (health + in-process run)
        run: |
          ./wedra gui --listen 127.0.0.1:8917 >/tmp/gui.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf 127.0.0.1:8917/api/health >/dev/null && break; sleep 0.5; done
          curl -sf 127.0.0.1:8917/api/health | grep '"status":"ok"'
          curl -sf 127.0.0.1:8917/api/runs | grep -E 'status|^\[\]$'
          # v0.9: без сессии человека мутации → 401
          curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8917/api/run -H 'Content-Type: application/json' -d '{"file":"when_demo.yaml","yes":true}' | grep 401
          LINK=$(grep -oE 'https?://[^[:space:]]+k=[0-9a-f]+' /tmp/gui.log | head -1)
          test -n "$LINK"
          curl -sf -o /dev/null -c /tmp/cj17 "$LINK"   # ?k= → HttpOnly cookie
          curl -sf -b /tmp/cj17 -X POST 127.0.0.1:8917/api/run -H 'Content-Type: application/json' -d '{"file":"when_demo.yaml","yes":true}' | grep started
          sleep 4
          curl -sf 127.0.0.1:8917/api/runs | grep when_demo
          kill $GUI_PID 2>/dev/null || true
          tail -n 5 /tmp/gui.log
      - name: v0.24 browser gate live (wait → decision via API)
        run: |
          ./wedra gui --listen 127.0.0.1:8918 >/tmp/gui-gate.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf 127.0.0.1:8918/api/health >/dev/null && break; sleep 0.5; done
          LINK=$(grep -oE 'https?://[^[:space:]]+k=[0-9a-f]+' /tmp/gui-gate.log | head -1)
          test -n "$LINK"
          curl -sf -o /dev/null -c /tmp/cj18 "$LINK"   # ?k= → HttpOnly cookie
          RUN_ID=$(curl -sf -b /tmp/cj18 -X POST 127.0.0.1:8918/api/run -H 'Content-Type: application/json' -d '{"file":"gate_demo.yaml","yes":false}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["run"])')
          echo "run: $RUN_ID"
          for i in $(seq 1 40); do
            curl -sf "127.0.0.1:8918/api/runs/$RUN_ID/gate" | grep '"pending":true' && break
            sleep 0.5
          done
          curl -sf "127.0.0.1:8918/api/runs/$RUN_ID/gate" | grep '"pending":true'
          # агент без cookie не может одобрить
          curl -s -o /dev/null -w '%{http_code}' -X POST "127.0.0.1:8918/api/runs/$RUN_ID/gate" -H 'Content-Type: application/json' -d '{"action":"accept"}' | grep 401
          curl -sf -b /tmp/cj18 -X POST "127.0.0.1:8918/api/runs/$RUN_ID/gate" -H 'Content-Type: application/json' -d '{"action":"accept"}' | grep queued
          # повторный submit — 409
          curl -s -b /tmp/cj18 -o /dev/null -w '%{http_code}' -X POST "127.0.0.1:8918/api/runs/$RUN_ID/gate" -H 'Content-Type: application/json' -d '{"action":"reject"}' | grep 409
          for i in $(seq 1 40); do
            curl -sf "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"gate_decision"' && break
            sleep 0.5
          done
          curl -sf "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"gate_decision"'
          curl -sf "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"action":"accept"'
          curl -sf "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"source":"gui"'
          ! grep -rq "$(echo "$LINK" | sed 's/.*k=//')" var/runs examples 2>/dev/null  # секрет не в журналах
          kill $GUI_PID 2>/dev/null || true
          tail -n 5 /tmp/gui-gate.log
      - name: v0.25 editor live (parse/serialize round-trip)
        run: |
          node --check web/static/editor/app.js
          ./wedra gui --listen 127.0.0.1:8919 >/tmp/gui-ed.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8919/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8919/editor/ | grep "редактор"
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/gate_demo.yaml | grep '"name":"gate_demo"'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/single_check.yaml | grep '"plugin":"core/human_gate"'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/when_demo.yaml | grep '"when":{"path":"steps.stats.words","op":"gte","value":10}'
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d "$(curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/single_check.yaml)" | grep '"ok":true'
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"when_ci","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","when":{"path":"input.x","op":"truthy"},"form":[],"actions":["accept"],"on_reject":"stop","unsupported":[]}]}' | grep '"ok":true'
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"when_ci2","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","when":{"path":"input.x","op":"gt","value":"15"},"form":[],"actions":["accept"],"on_reject":"stop","unsupported":[]}]}' | grep 'value: 15'
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"when_ci3","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","when":{"path":"input.x","op":"bogo"},"form":[],"actions":["accept"],"on_reject":"stop","unsupported":[]}]}' | grep '"ok":false'
          echo "when editor: live checks ok"
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/foreach_step_demo.yaml | grep '"foreach":"input.texts"'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/parallel_demo.yaml | grep '"parallel_group":"analyze"'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/csv_foreach_summary.yaml | grep '"after_foreach":true'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/csv_foreach_summary.yaml | grep '"foreach":"steps.load.rows"'
          echo "flow editor: live checks ok"
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/llm_same_provider.yaml | grep '"secrets":\["GEMINI_API_KEY"\]'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/llm_same_provider.yaml | grep '"retry":{"attempts":3,"delay":"2s","backoff":"exponential"}'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/llm_same_provider.yaml | grep '"on_error":"retry"'
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"retry_ci","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"retry","bind":{},"form":[],"actions":["accept"],"on_reject":"","retry":{"attempts":0,"delay":"1s","backoff":"fixed"},"unsupported":[]}]}' | grep '"ok":false'
          echo "retry editor: live checks ok"
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"secrets_ci","input":[],"secrets":["CI_KEY_XYZ"],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","bind":{},"form":[],"actions":["accept"],"on_reject":"","unsupported":[]}]}' | grep "secrets:"
          echo "secrets editor: live checks ok"
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/text_stats.yaml | grep '"network":"deny"'
          curl -sf -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"net_ci","input":[],"network":"deny","steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","bind":{},"form":[],"actions":["accept"],"on_reject":"","unsupported":[]}]}' | grep "network: deny"
          curl -sf localhost:8919/api/plugins | grep '"any_host":true'
          echo "network editor: live checks ok"
          kill $GUI_PID 2>/dev/null || true
          tail -n 3 /tmp/gui-ed.log
      - name: v0.7 standalone binary (embedded GUI, no repo)
        run: |
          mkdir -p /tmp/wedra-standalone
          cp ./wedra /tmp/wedra-standalone/
          cd /tmp/wedra-standalone
          ./wedra gui --listen 127.0.0.1:8920 >/tmp/gui-embed.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8920/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8920/ | grep "WEDRA"
          curl -sf localhost:8920/editor/ | grep "редактор"
          curl -sf localhost:8920/editor/app.js | grep "pluginNetworkHint"
          curl -sf localhost:8920/app.js | grep "api/health"
          kill $GUI_PID 2>/dev/null || true
          tail -n 3 /tmp/gui-embed.log
      - name: v0.8 desktop exe (wedragui) — cross-builds + PE check
        run: |
          go build -o /tmp/wedragui-linux ./cmd/wedragui
          GOOS=windows GOARCH=amd64 go build -o /tmp/wedragui-win-amd64.exe ./cmd/wedragui
          GOOS=windows GOARCH=arm64 go build -o /tmp/wedragui-win-arm64.exe ./cmd/wedragui
          GOOS=darwin GOARCH=amd64 go build -o /tmp/wedragui-darwin ./cmd/wedragui
          head -c2 /tmp/wedragui-win-amd64.exe | grep MZ
      - name: v0.8 desktop live (embedded GUI, clean dir)
        run: |
          mkdir -p /tmp/wedragui-live && cd /tmp/wedragui-live
          /tmp/wedragui-linux --port 8921 >/tmp/wedragui.log 2>&1 &
          WG_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8921/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8921/ | grep "WEDRA"
          curl -sf localhost:8921/editor/ | grep "редактор"
          grep -q "WEDRA desktop" /tmp/wedragui.log
          kill -TERM $WG_PID
          sleep 1
          pgrep -x wedragui-linux >/dev/null && exit 1 || true
      - name: v0.9 agent track (validate --json, conformance, MCP)
        run: |
          ./wedra pipeline validate examples/email_triage_chain.yaml --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"], d'
          printf 'format_version: "0.2"\npipeline:\n  name: bad\n  input: {text: x}\n  steps:\n    - {id: a, plugin: plugins/community/text_analyzer, bind: {text: input.nope}}\n' > /tmp/bad.yaml
          ! ./wedra pipeline validate /tmp/bad.yaml --json > /tmp/bad.json
          grep -q E_PORT_SOURCE /tmp/bad.json
          ./wedra plugin test internal/core/testdata/plugins --conformance
          # contract_input роняет элемент, не ран (exit 1 = были aborted — ожидаемо)
          (./wedra pipeline run examples/email_triage_chain.yaml --yes || true) | grep 'ok=3 aborted=1'
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | ./wedra mcp --plugins "$PWD/plugins" --workdir "$PWD" --no-gui 2>/dev/null > /tmp/mcp.out
          grep -q '"version":"'"$(cat VERSION)"'"' /tmp/mcp.out
          grep -q cancel_run /tmp/mcp.out
      - name: foreach + after_foreach live
        run: |
          ./wedra pipeline run examples/csv_foreach.yaml --yes
          ./wedra pipeline run examples/csv_foreach_summary.yaml --yes
      - name: resume live
        run: |
          ./wedra pipeline run examples/csv_foreach.yaml --yes --runs-dir=var/runs | tail
          last=$(ls -t var/runs | head -1)
          echo "resume $last"
          ./wedra runs show $last
          ./wedra runs list
      - name: json store live
        run: |
          ./wedra pipeline run examples/csv_foreach_summary.yaml --yes --store=json --db-path=var/runs/runs.db
          ./wedra runs list --store=json --db-path=var/runs/runs.db
          last=$(./wedra runs list --store=json --db-path=var/runs/runs.db | grep -oE '[0-9]{8}-[0-9]{6}-[a-z0-9_-]+' | head -1)
          echo "json run $last"
          ./wedra runs show $last --store=json --db-path=var/runs/runs.db
      - name: schemas check
        run: |
          ls schemas/
          ls protocol/ protocol/v0.2/
          cat schemas/pipeline.v0.2.schema.json | head -n 20

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./cmd/wedra
      - run: go build ./cmd/wedragui

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test ./internal/core -run TestConformance -count=1
      - run: go build ./cmd/wedra
      - run: go build ./cmd/wedragui

  # v0.17: trust-гейт релиза — на теге реестр проверяется по РЕАЛЬНЫМ пинам
  # (клоны git по version из registry.yaml), без local-source.
  registry-release:
    needs: core
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
      - run: go build -o wedra ./cmd/wedra
      - run: ./wedra registry validate --registry=registry.yaml

  release:
    needs: [core, windows, macos, registry-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
