name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: go fmt check
        run: |
          out=$(gofmt -l ./internal ./cmd/tool)
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi
      - name: go test
        run: go test ./... -count=1 -run Test -v -race
      - name: conformance tests
        run: go test ./internal/core -run TestConformance -v -count=1
      - name: build tool
        run: go build -o tool ./cmd/tool
      - name: build wedra
        run: go build -o wedra ./cmd/wedra
      - name: plugin validate + test (official/community)
        run: |
          for d in plugins/official/* plugins/community/*; do
            if [ -f "$d/plugin.yaml" ]; then
              echo "== $d =="
              ./tool plugin validate "$d"
              ./tool plugin test "$d"
            fi
          done
      - name: plugin list + search
        run: |
          ./tool plugin list
          ./tool plugin search csv
          ./tool plugin search llm
      - name: pipeline validate + lint + plan (all pipelines)
        run: |
          for f in examples/*.yaml; do
            echo "== validate $f =="
            ./wedra pipeline validate "$f"
            echo "== lint $f =="
            ./wedra pipeline lint "$f"
            echo "== plan $f =="
            ./wedra pipeline plan "$f"
          done
      - name: v0.20 control flow live (when, foreach-step, parallel)
        run: |
          ./wedra pipeline run examples/when_demo.yaml --yes
          ./wedra pipeline run examples/foreach_step_demo.yaml --yes
          ./wedra pipeline run examples/parallel_demo.yaml --yes
      - name: v0.22 GUI API live (health + in-process run)
        run: |
          ./wedra gui --listen 127.0.0.1:8917 >/tmp/gui.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8917/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8917/api/health | grep -q '"status":"ok"'
          curl -sf localhost:8917/api/runs | grep -q 'status'
          curl -sf -X POST localhost:8917/api/run -H 'Content-Type: application/json' -d '{"file":"when_demo.yaml","yes":true}' | grep -q started
          sleep 4
          curl -sf localhost:8917/api/runs | grep -q when_demo
          kill $GUI_PID 2>/dev/null || true
          tail -n 5 /tmp/gui.log
      - name: v0.24 browser gate live (wait → decision via API)
        run: |
          ./wedra gui --listen 127.0.0.1:8918 >/tmp/gui-gate.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8918/api/health >/dev/null && break; sleep 0.5; done
          RUN_ID=$(curl -sf -X POST localhost:8918/api/run -H 'Content-Type: application/json' -d '{"file":"gate_demo.yaml","yes":false}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["run"])')
          echo "run: $RUN_ID"
          for i in $(seq 1 40); do
            curl -sf "localhost:8918/api/runs/$RUN_ID/gate" | grep -q '"pending":true' && break
            sleep 0.5
          done
          curl -sf "localhost:8918/api/runs/$RUN_ID/gate" | grep -q '"pending":true'
          curl -sf -X POST "localhost:8918/api/runs/$RUN_ID/gate" -H 'Content-Type: application/json' -d '{"action":"accept"}' | grep -q queued
          # повторный submit — 409
          curl -s -o /dev/null -w '%{http_code}' -X POST "localhost:8918/api/runs/$RUN_ID/gate" -H 'Content-Type: application/json' -d '{"action":"reject"}' | grep -q 409
          for i in $(seq 1 40); do
            curl -sf "localhost:8918/api/runs/$RUN_ID/journal?since=0" | grep -q '"gate_decision"' && break
            sleep 0.5
          done
          curl -sf "localhost:8918/api/runs/$RUN_ID/journal?since=0" | grep -q '"gate_decision"'
          curl -sf "localhost:8918/api/runs/$RUN_ID/journal?since=0" | grep -q '"action":"accept"'
          kill $GUI_PID 2>/dev/null || true
          tail -n 5 /tmp/gui-gate.log
      - name: v0.25 editor live (parse/serialize round-trip)
        run: |
          node --check web/static/editor/app.js
          ./wedra gui --listen 127.0.0.1:8919 >/tmp/gui-ed.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8919/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8919/editor/ | grep -q "редактор"
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/gate_demo.yaml | grep -q '"name":"gate_demo"'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/single_check.yaml | grep -q '"plugin":"core/human_gate"'
          curl -sf -X POST localhost:8919/api/parse/pipeline --data-binary @examples/when_demo.yaml | grep -q "when"
          kill $GUI_PID 2>/dev/null || true
          tail -n 3 /tmp/gui-ed.log
      - name: foreach + after_foreach live
        run: |
          ./wedra pipeline run examples/csv_foreach.yaml --yes
          ./wedra pipeline run examples/csv_foreach_summary.yaml --yes
      - name: resume live
        run: |
          ./wedra pipeline run examples/csv_foreach.yaml --yes --runs-dir=var/runs | tail
          last=$(ls -t var/runs | head -1)
          echo "resume $last"
          ./wedra runs show $last
          ./wedra runs list
      - name: json store live
        run: |
          ./wedra pipeline run examples/csv_foreach_summary.yaml --yes --store=json --db-path=var/runs/runs.db
          ./wedra runs list --store=json --db-path=var/runs/runs.db
          last=$(./wedra runs list --store=json --db-path=var/runs/runs.db | grep -oE '[0-9]{8}-[0-9]{6}-[a-z0-9_-]+' | head -1)
          echo "json run $last"
          ./wedra runs show $last --store=json --db-path=var/runs/runs.db
      - name: schemas check
        run: |
          ls schemas/
          ls protocol/ protocol/v0.2/
          cat schemas/pipeline.v0.2.schema.json | head -n 20

      - name: registry validate (local source)
        run: ./wedra registry validate --registry=registry.yaml --local-source=.

  # v0.17: trust-гейт релиза — на теге реестр проверяется по РЕАЛЬНЫМ пинам
  # (клоны git по version из registry.yaml), без local-source.
  registry-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -o wedra ./cmd/wedra
      - run: ./wedra registry validate --registry=registry.yaml
