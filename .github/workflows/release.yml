# Каждый одобренный release tag = GitHub Release с бинарниками и conformance asset.
# Это то, что получают пользователи: скачать и запустить без Go.
name: release
on:
  workflow_call:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: release version check
        run: |
          set -eu
          file_version=$(tr -d '\r\n' < VERSION)
          test "${GITHUB_REF_NAME#v}" = "$file_version"
      - name: dependency integrity
        run: go mod verify
      - name: vulnerability scan
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: static checks
        run: |
          go vet ./...
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - name: tests
        run: go test ./... -count=1
      - name: registry pin validation
        run: go run ./cmd/wedra registry validate --registry=registry.yaml
      - name: conformance
        run: go test ./internal/core -run TestConformance -count=1
      - name: build all platforms
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X wedra/internal/api.Version=${VER} -X wedra/internal/mcp.Version=${VER}"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              echo "== $os/$arch (Version=$VER)"
              GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" -o "dist/wedra-${os}-${arch}${ext}" ./cmd/wedra
              GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" -o "dist/tool-${os}-${arch}${ext}" ./cmd/tool
            done
          done
          # v0.8: desktop-exe (Windows: окно WebView2, чистый Go)
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -ldflags="$LDFLAGS" -o "dist/wedragui-windows-${arch}.exe" ./cmd/wedragui
          done
          mkdir -p dist/conformance-package/conformance/fixtures
          cp conformance/README.md conformance/manifest.json dist/conformance-package/conformance/
          cp -R conformance/fixtures/v0.2 dist/conformance-package/conformance/fixtures/
          (cd dist/conformance-package && zip -qr "../wedra-conformance-v${VER}.zip" .)
          smoke_dir=$(mktemp -d)
          unzip -q "dist/wedra-conformance-v${VER}.zip" -d "$smoke_dir"
          ./dist/wedra-linux-amd64 plugin test --conformance --fixtures="$smoke_dir/conformance/fixtures/v0.2" --json
          rm -rf "$smoke_dir" dist/conformance-package
      - name: generate SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: checksums
        run: sha256sum dist/wedra-* dist/tool-* dist/wedragui-* dist/sbom.spdx.json > dist/SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
