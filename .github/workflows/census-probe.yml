name: census-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: emit every candidate channel
        shell: pwsh
        run: |
          $m = 'PROBE2-9c41de'
          Write-Output "stdout: $m"
          Write-Output "::notice title=census-probe-notice::$m"
          Write-Output "::error title=census-probe-error::$m"
          "::warning title=census-probe-warning::$m" | Write-Output
      - name: hang forever
        shell: pwsh
        timeout-minutes: 2
        run: Start-Sleep -Seconds 900
