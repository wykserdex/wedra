format_version: "0.1"

pipeline:
  name: email_check
  input:
    emails:
      - "test@yandex.ru"        # валидный, не disposable → человек принимает
      - "user@mailinator.com"   # валидный, disposable → человек решает
      - "bad-email"             # доменная ошибка на syntax → on_error: stop,
                                # в foreach-scope: элемент aborted, ран идёт дальше
  foreach: input.emails
  foreach_item: item            # плагины читают input.item
  item_type: string             # контракт элемента — нужен статической валидации
  item_format: email

  steps:
    - id: syntax
      plugin: plugins/syntax_mx_checker
      on_error: stop
      timeout: 10s

    - id: disposable
      plugin: plugins/disposable_checker
      on_error: skip            # если этот шаг падает — цепочка продолжается без него
      timeout: 5s

    - id: review
      plugin: core/human_gate   # встроенная нода ядра, CLI-версия
      form:
        - { field: steps.syntax.mx, editable: false }
        - { field: steps.disposable.disposable, editable: true, type: boolean }
      actions: [accept, reject]
      on_reject: stop
