# Контракт-тесты text_analyzer (воспроизводят кейсы внешнего автора).
tests:
  - name: считает строки слова и уникальные слова
    input: { text: "кот кот\nпёс ёлка" }
    expect:
      status: ok
      output:
        lines: 2
        words: 4
        unique_words: 3
        longest_word: "ёлка"

  - name: пустой текст является доменной ошибкой
    input: { text: "   " }
    expect:
      status: error
      exit_code: 1
      error: { code: empty_text, retryable: false }

  - name: битый JSON является платформенной ошибкой
    input_raw: "{oops"
    expect:
      exit_code: 2
