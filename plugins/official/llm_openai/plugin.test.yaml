# Контракт-тесты llm_openai (OpenAI-совместимый; для Grok — env base_url).
tests:
  - name: mock-режим без ключа → ok
    env: { LLM_MOCK: "1" }
    input: { prompt: "черновик", system: "правь строго" }
    expect:
      status: ok
      output:
        text:  { contains: "[mock:" }
        model: { present: true }

  - name: пустой prompt → доменная ошибка
    env: { LLM_MOCK: "1" }
    input: { prompt: "  " }
    expect:
      status: error
      exit_code: 1
      error: { code: empty_prompt }

  - name: без ключа → no_api_key
    env: { LLM_MOCK: "", LLM_OAI_API_KEY: "" }
    input: { prompt: "x" }
    expect:
      status: error
      exit_code: 1
      error: { code: no_api_key, retryable: false }

  - name: битый JSON → платформенная ошибка
    env: { LLM_MOCK: "1" }
    input_raw: "[не json"
    expect:
      exit_code: 2
