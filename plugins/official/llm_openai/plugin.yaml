id: llm_openai
version: 0.1.0
platform_api: "^0.1"
description: >
  OpenAI-совместимый chat/completions. Подходит для OpenAI, xAI (Grok),
  DeepSeek, OpenRouter, локальных vLLM/Ollama — всё через env-конфигурацию.
  Для Grok: LLM_OAI_BASE_URL=https://api.x.ai/v1, LLM_OAI_MODEL=grok-3-mini.

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib

input:
  prompt:
    from: steps.review.text      # текст, одобренный/исправленный человеком
    type: string
    format: text
  system:
    from: input.refine_system
    type: string
    optional: true

output:
  text:  { type: string, format: text }
  model: { type: string }

permissions:
  network: [ { any_host: true, port: 443 } ]   # base_url настраивается пользователем
  filesystem: none
  secrets: [ "LLM_OAI_API_KEY" ]
