id: syntax_mx_checker
version: 0.1.0
platform_api: "^0.1"

runtime:
  type: python
  entry: main.py
  requires: ["dnspython (опционально; без него MX-проверка деградирует до skip с варнингом в журнал)"]

input:
  email:
    from: input.item
    type: string
    format: email

output:
  syntax: { type: boolean }
  mx:     { type: array }   # MX-хосты домена; [] если DNS недоступен

permissions:
  network: [ { note: "DNS MX lookup", any_host: true, port: 53 } ]
  filesystem: none
  secrets: []
