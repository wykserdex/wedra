id: llm_anthropic
version: 0.1.0
platform_api: "^0.1"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib

input:
  prompt:
    from: input.topic
    type: string
    format: text
  system:
    from: input.draft_system
    type: string
    optional: true

output:
  text:  { type: string, format: text }
  model: { type: string }

permissions:
  network: [ { any_host: true, port: 443, note: "target: api.anthropic.com:443; per-host egress is not enforced yet, so blanket egress is requested explicitly" } ]
  filesystem: none
  secrets: [ "ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "LLM_TIMEOUT" ]
