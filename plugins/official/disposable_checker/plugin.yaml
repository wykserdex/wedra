id: disposable_checker
version: 0.1.0
platform_api: "^0.1"

runtime:
  type: python
  entry: main.py
  requires: []

input:
  email:
    from: input.item
    type: string
    format: email

output:
  disposable: { type: boolean }
  domain:     { type: string }

permissions:
  network: []            # работает офлайн, по встроенному списку доменов
  filesystem: none
  secrets: []
