id: llm_gemini
version: 0.1.0
platform_api: "^0.1"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib (urllib)

input:
  prompt:
    from: input.topic
    type: string
    format: text
  system:
    from: input.draft_system
    type: string
    optional: true

output:
  text:  { type: string, format: text }
  model: { type: string }

permissions:
  network: [ { host: "generativelanguage.googleapis.com", port: 443 } ]
  filesystem: none
  secrets: [ "GEMINI_API_KEY" ]
