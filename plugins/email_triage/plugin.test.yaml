tests:
  - name: чистый email → good, risk 10
    input: { email: "info@gmail.com" }
    expect:
      status: ok
      output:
        verdict: "good"
        risk: 10
        reasons: { contains: "clean" }

  - name: bad syntax → bad, risk 90
    input: { email: "bad@example.com", syntax_ok: false }
    expect:
      status: ok
      output:
        verdict: "bad"
        risk: 90
        reasons: { contains: "bad_syntax" }

  - name: disposable → bad, risk 80
    input: { email: "user@mailinator.com", disposable: true }
    expect:
      status: ok
      output:
        verdict: "bad"
        risk: 80
        reasons: { contains: "disposable" }

  - name: оба плохих → risk 99 (пример из фидбека)
    input: { email: "bad@mailinator.com", syntax_ok: false, disposable: true }
    expect:
      status: ok
      output:
        risk: 99
        verdict: "bad"
        reasons: { type: array }

  - name: только email без optional — работает (проверка бага #10)
    input: { email: "a@b.com" }
    expect:
      status: ok
      output:
        risk: { present: true }
        verdict: { present: true }

  - name: пустой email → empty_input
    input: { email: "   " }
    expect:
      status: error
      exit_code: 1
      error: { code: empty_input }

  - name: email без @ → bad_syntax
    input: { email: "not-an-email" }
    expect:
      status: error
      exit_code: 1
      error: { code: bad_syntax }

  - name: email не строка → platform:bad_input
    input: { email: 123 }
    expect:
      exit_code: 2
      error: { code: "platform:bad_input" }

  - name: syntax_ok не bool → platform:bad_input
    input: { email: "a@b.com", syntax_ok: "yes" }
    expect:
      exit_code: 2
      error: { code: "platform:bad_input" }

  - name: disposable не bool → platform:bad_input
    input: { email: "a@b.com", disposable: "no" }
    expect:
      exit_code: 2
      error: { code: "platform:bad_input" }
