tests:
  - name: русская дата «12 марта 2024»
    input: { text: "12 марта 2024" }
    expect:
      status: ok
      output:
        iso: "2024-03-12"
        parsed: true
        format: "ru_d_month_y"

  - name: ISO на входе проходит как есть
    input: { text: "2024-03-12" }
    expect:
      status: ok
      output:
        iso: "2024-03-12"
        format: "iso"

  - name: английская дата March 12, 2024
    input: { text: "March 12, 2024", lang: "en" }
    expect:
      status: ok
      output:
        iso: "2024-03-12"
        format: "en_month_d_y"

  - name: нераспознанная дата — доменная ошибка
    input: { text: "вчера-позавчера" }
    expect:
      status: error
      exit_code: 1
      error: { code: unparseable_date, retryable: false }

  - name: битый JSON — платформенная ошибка
    input_raw: "{oops"
    expect:
      exit_code: 2

  - name: числовая дата en читается как месяц/день
    input: { text: "03/12/2024", lang: "en" }
    expect:
      status: ok
      output:
        iso: "2024-03-12"
        format: "en_md_y"

  - name: числовая дата ru читается как день/месяц
    input: { text: "03/12/2024", lang: "ru" }
    expect:
      status: ok
      output:
        iso: "2024-12-03"
        format: "ru_numeric"

  - name: неоднозначный slash без lang отвергается
    input: { text: "03/12/2024" }
    expect:
      status: error
      error: { code: unparseable_date }

  - name: невозможная календарная дата отвергается
    input: { text: "31.02.2024", lang: "ru" }
    expect:
      status: error
      error: { code: unparseable_date }

  - name: невозможная ISO-дата отвергается
    input: { text: "2024-02-31" }
    expect:
      status: error
      error: { code: unparseable_date }

  - name: en-GB использует день/месяц
    input: { text: "03/12/2024", lang: "en-GB" }
    expect:
      status: ok
      output:
        iso: "2024-12-03"
        format: "en_dmy_y"
