id: text_analyzer
version: 0.1.0
platform_api: "^0.1"
description: "Метрики текста: строки, слова, уникальные слова, длиннейшее слово"
author: "community · тестер №1 (M5)"   # первый внешний плагин по контракту

runtime:
  type: python
  entry: main.py
  requires: []

input:
  text:
    from: input.text
    type: string
    format: text

output:
  lines:        { type: number }
  words:        { type: number }
  unique_words: { type: number }
  longest_word: { type: string }

permissions:
  network: []
  filesystem: none
  secrets: []
