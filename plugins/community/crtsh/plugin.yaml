id: crtsh
version: 0.1.0
platform_api: "^0.1"
description: >
  crt.sh (Certificate Transparency) — сертификаты по домену. Чистый HTTP
  (stdlib, без зависимостей): GET https://crt.sh/?q=%25.<domain>&output=json →
  имена (CN+SAN), issuers, просроченные. Выход агрегированный (реестр может
  вернуть тысячи записей — сырьё не тащим).
author: "community · wedra showcase (OSINT)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib

input:
  domain:
    from: input.domain
    type: string
    format: text
  timeout:
    from: input.timeout
    type: number
    optional: true      # HTTP-таймаут, секунды (default 30)

output:
  domain:    { type: string }
  total:     { type: number }
  names:     { type: array }
  issuers:   { type: array }
  expired:   { type: number }

permissions:
  network: [ { host: crt.sh, port: 443 } ]
  filesystem: none
  secrets: []
