id: csv_loader
version: 0.1.0
platform_api: "^0.1"
description: "Загрузчик CSV: читает file_ref и отдаёт массив строк — проверка file_ref, массивов, exit 1 vs 2"
author: "external author #4 (M5, 2026-08-28) — csv_loader"

runtime:
  type: python
  entry: main.py
  requires: []

input:
  path:
    type: string
    format: file_ref
  delimiter:
    type: string
    optional: true
  has_header:
    type: boolean
    optional: true

output:
  row_count: { type: number }
  headers: { type: array }
  rows: { type: array }

permissions:
  network: []
  filesystem: read
  secrets: []
