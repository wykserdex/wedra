tests:
  - name: грузит sample.csv с заголовком
    input: { path: "testdata/sample.csv" }
    expect:
      status: ok
      output:
        row_count: 2
        headers: { contains: "name" }
        rows: { type: array }

  - name: row_count и headers присутствуют
    input: { path: "testdata/sample.csv" }
    expect:
      status: ok
      output:
        row_count: { present: true }
        headers: { present: true }

  - name: файл не найден — доменная ошибка file_not_found
    input: { path: "testdata/нету.csv" }
    expect:
      status: error
      exit_code: 1
      error: { code: file_not_found }

  - name: пустой path — empty_path
    input: { path: "   " }
    expect:
      status: error
      exit_code: 1
      error: { code: empty_path }

  - name: path не строка — платформенная bad_input (exit 2)
    input: { path: 123 }
    expect:
      exit_code: 2
      error: { code: "platform:bad_input" }

  - name: delimiter не строка — platform:bad_input
    input: { path: "testdata/sample.csv", delimiter: 123 }
    expect:
      exit_code: 2
      error: { code: "platform:bad_input" }

  - name: has_header false — без заголовков
    input: { path: "testdata/sample.csv", has_header: false }
    expect:
      status: ok
      output:
        row_count: 3
        rows: { type: array }
