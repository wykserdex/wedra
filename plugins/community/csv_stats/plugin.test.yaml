tests:
  - name: базовая статистика
    input:
      csv_text: "name,score\nanna,10\nbob,20\ncid,30\n"
      column: "score"
    expect:
      status: ok
      output:
        count: { equals: 3 }
        mean: { equals: 20 }
        min: { equals: 10 }
        max: { equals: 30 }
        sum: { equals: 60 }
        skipped: { equals: 0 }
  - name: мусорные ячейки пропускаются
    input:
      csv_text: "name,score\nanna,10\nbob,n/a\ncid,30\n"
      column: "score"
    expect:
      status: ok
      output:
        count: { equals: 2 }
        skipped: { equals: 1 }
  - name: нет колонки → ошибка
    input:
      csv_text: "name,score\nanna,10\n"
      column: "age"
    expect:
      status: error
      error: { code: no_column }
  - name: нет чисел → ошибка
    input:
      csv_text: "name,score\nanna,x\nbob,y\n"
      column: "score"
    expect:
      status: error
      error: { code: no_numeric }

  - name: NaN и Infinity пропускаются, JSON остаётся корректным
    input:
      csv_text: "value\nNaN\nInfinity\n2\n"
      column: "value"
    expect:
      status: ok
      output:
        count: { equals: 1 }
        mean: { equals: 2 }
        min: { equals: 2 }
        max: { equals: 2 }
        sum: { equals: 2 }
        skipped: { equals: 2 }

  - name: только NaN и Infinity → no_numeric
    input:
      csv_text: "value\nNaN\n-Infinity\n"
      column: "value"
    expect:
      status: error
      error: { code: no_numeric }

  - name: переполнение суммы возвращает ошибку, не NaN или Infinity
    input:
      csv_text: "value\n1e308\n1e308\n"
      column: "value"
    expect:
      status: error
      error: { code: numeric_overflow }
