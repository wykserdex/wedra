# Контракт-тесты buckethacker (mock buckethacker CLI, без сети и без пакета).
tests:
  - name: JSON-массив → открыто на azure, s3 закрыт
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py" }
    input: { name: "demo-bucket" }
    expect:
      status: ok
      output:
        name: demo-bucket
        provider: azure
        open: true
        count: 3
        services: [s3, azure, "azure blob"]

  - name: текстовый вывод → тот же разбор (эвристика по маркерам)
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py", MOCK_TEXT: "1" }
    input: { name: "demo-bucket" }
    expect:
      status: ok
      output:
        name: demo-bucket
        provider: azure
        open: true
        count: 3
        services: [aws, azure, gcp]

  - name: пустой результат → ok, open false, пустой массив
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py", MOCK_EMPTY: "1" }
    input: { name: "clean-bucket" }
    expect:
      status: ok
      output:
        name: clean-bucket
        provider: ""
        open: false
        count: 0
        services: []

  - name: пустой name → доменная ошибка
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py" }
    input: { name: "   " }
    expect:
      status: error
      exit_code: 1
      error: { code: empty_name, retryable: false }

  - name: нечисловой wall_timeout → платформенная ошибка
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py" }
    input: { name: "demo-bucket", wall_timeout: "быстро" }
    expect:
      status: error
      exit_code: 2
      error: { code: platform:bad_wall_timeout }

  - name: buckethacker не установлен (путь)
    env: { BUCKETHACKER_BIN: "/nonexistent/buckethacker-bin" }
    input: { name: "demo-bucket" }
    expect:
      status: error
      exit_code: 1
      error: { code: buckethacker_not_installed, retryable: false }

  - name: buckethacker не установлен (имя из PATH)
    env: { BUCKETHACKER_BIN: "definitely_not_a_buckethacker_bin_xyz" }
    input: { name: "demo-bucket" }
    expect:
      status: error
      exit_code: 1
      error: { code: buckethacker_not_installed }

  - name: wall timeout → доменная, retryable
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py", MOCK_SLEEP: "3" }
    input: { name: "demo-bucket", wall_timeout: 1 }
    expect:
      status: error
      exit_code: 1
      error: { code: timeout, retryable: true }

  - name: buckethacker без вывода → доменная ошибка
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py", MOCK_NO_REPORT: "1" }
    input: { name: "demo-bucket" }
    expect:
      status: error
      exit_code: 1
      error: { code: no_report }

  - name: buckethacker упал → доменная ошибка
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py", MOCK_FAIL: "1" }
    input: { name: "demo-bucket" }
    expect:
      status: error
      exit_code: 1
      error: { code: tool_failed, retryable: false }

  - name: битый JSON вывода → платформенная ошибка
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py", MOCK_BAD_REPORT: "1" }
    input: { name: "demo-bucket" }
    expect:
      status: error
      exit_code: 2
      error: { code: platform:bad_report }

  - name: битый JSON входа → платформенная ошибка
    env: { BUCKETHACKER_BIN: "mock_buckethacker.py" }
    input_raw: "{не json"
    expect:
      status: error
      exit_code: 2
      error: { code: platform:bad_input }