id: buckethacker
version: 0.1.0
platform_api: "^0.1"
description: >
  buckethacker — поиск открытых облачных хранилищ (S3/Azure Blob/GCS/Spaces)
  по имени бакета или аккаунта. Обёртка над CLI buckethacker: отдаёт имя,
  провайдера, признак открытости и список сервисов, где хранилище открыто.
  ВНИМАНИЕ: донор не подтверждён в сети — репозиторий ingo60/buckethacker на
  GitHub не существует (поиск по имени даёт 0 репозиториев). CLI собран
  консервативно: <BUCKETHACKER_BIN|buckethacker> <name> без флагов, отчёт
  читается из stdout (JSON, при его отсутствии — осторожный разбор текста).
  Ставится отдельно: pip install buckethacker.
author: "community · wedra showcase (OSINT)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib; пакет buckethacker — отдельно

input:
  name:
    from: input.name
    type: string
    format: text        # имя бакета, контейнера или storage-аккаунта
  wall_timeout:
    from: input.wall_timeout
    type: number
    optional: true      # общий лимит рана, секунды (default 300)

output:
  name:      { type: string }
  provider:  { type: string }
  open:      { type: boolean }
  services:  { type: array }
  count:     { type: number }

permissions:
  network:
    - { any_host: true, port: 443, note: "target: публичные эндпоинты облачных хранилищ" }
    - { any_host: true, port: 80, note: "target: http-варианты S3-совместимых хранилищ" }
  filesystem: none
  secrets: []           # анонимный поиск, ключи не нужны