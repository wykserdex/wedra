id: pefile
version: 0.1.0
platform_api: "^0.1"
description: >
  pefile (erocarrera/pefile) — разбор PE-файлов: архитектура, секции и
  импортируемые DLL с символами. У донора нет CLI, поэтому плагин запускает
  тот же интерпретатор с фиксированным сниппетом (-c), который импортирует
  pefile и печатает JSON (паттерн C). Библиотека ставится отдельно:
  pip install pefile.
author: "community · wedra showcase (reverse engineering)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib; пакет pefile — отдельно (pip install pefile)

input:
  file:
    from: input.file
    type: string
    format: text        # путь к PE-файлу (.exe/.dll/.sys); должен существовать
  wall_timeout:
    from: input.wall_timeout
    type: number
    optional: true      # общий лимит рана, секунды (default 300)

output:
  file:     { type: string }
  machine:  { type: string }
  sections: { type: array }
  imports:  { type: array }
  count:    { type: number }

permissions:
  network: []
  filesystem: read      # читает только указанный пользователем PE-файл
  secrets: []