id: dir_lister
version: 0.1.0
platform_api: "^0.1"
description: "Инвентаризация файлов в директории workspace: счёт по расширениям, суммарный размер"
author: "community · тестер №1 (M5 — оригинал, заменил реконструкцию v0.18)"

runtime:
  type: python
  entry: main.py
  requires: []

input:
  path:
    from: input.path
    type: string
    format: text

output:
  path: { type: string }
  file_count: { type: number }
  total_size_bytes: { type: number }
  by_extension: { type: object }

permissions:
  network: []
  filesystem: workspace
  secrets: []
