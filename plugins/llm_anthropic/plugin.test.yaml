# Контракт-тесты llm_anthropic.
tests:
  - name: mock-режим без ключа → ok
    env: { LLM_MOCK: "1" }
    input: { prompt: "тема" }
    expect:
      status: ok
      output:
        text:  { contains: "[mock:" }
        model: { present: true }

  - name: без ключа → no_api_key
    env: { LLM_MOCK: "", ANTHROPIC_API_KEY: "" }
    input: { prompt: "x" }
    expect:
      status: error
      exit_code: 1
      error: { code: no_api_key, retryable: false }

  - name: битый JSON → платформенная ошибка
    env: { LLM_MOCK: "1" }
    input_raw: "{oops"
    expect:
      exit_code: 2
