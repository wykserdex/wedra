format_version: "0.2"

# Демо контракта v0.2: bind.
# ОДИН плагин (llm_gemini) используется дважды в одной цепочке — раньше это было
# невозможно, потому что разводка from: зашивалась в манифест.
#   тема → Gemini черновик → [человек правит] → Gemini доработка ПРАВКИ
#
# Демо без ключей:  LLM_MOCK=1 ./tool run pipelines/llm_same_provider.yaml

pipeline:
  name: llm_same_provider
  input:
    topic: "арбузы: витамины и сезон"
    draft_system: "Ты — копирайтер. Один абзац, 3 предложения."
    refine_system: "Ты — редактор. Убери воду, оставь факты."

  steps:
    - id: draft
      plugin: plugins/llm_gemini
      # без bind: дефолтная разводка манифеста (input.topic, input.draft_system)
      on_error: retry
      retry: { attempts: 3, delay: 2s, backoff: exponential }
      timeout: 45s

    - id: review
      plugin: core/human_gate
      form:
        - { field: steps.draft.text, editable: true, type: string, format: text }
      actions: [accept, reject]
      on_reject: stop

    - id: refine
      plugin: plugins/llm_gemini            # ← тот же плагин второй раз
      bind:                                 # v0.2: пайплайн перекрывает разводку манифеста
        prompt: steps.review.text           #     текст, одобренный человеком
        system: input.refine_system         #     инструкция для другой роли
      on_error: retry
      retry: { attempts: 3, delay: 2s, backoff: exponential }
      timeout: 45s
