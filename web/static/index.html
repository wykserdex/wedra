<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>orchestrator — консоль</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2330; --line:#2d333b;
    --tx:#e6edf3; --dim:#8b949e; --acc:#58a6ff;
    --ok:#3fb950; --err:#f85149; --skip:#d29922; --par:#bc8cff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--tx);font-size:14px}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header h1 .dot{color:var(--ok)}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
  .badge.ok{color:var(--ok);border-color:rgba(63,185,80,.4)}
  .badge.err{color:var(--err);border-color:rgba(248,81,73,.4)}
  .badge.run{color:var(--acc);border-color:rgba(88,166,255,.4);animation:pulse 1.2s infinite}
  .badge.skip{color:var(--skip);border-color:rgba(210,153,34,.4)}
  @keyframes pulse{50%{opacity:.5}}
  nav{display:flex;gap:4px;margin-left:10px}
  nav button{background:none;border:1px solid transparent;color:var(--dim);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.active{color:var(--tx);background:var(--bg3);border-color:var(--line)}
  a.link{color:var(--dim);text-decoration:none;font-size:12px;margin-left:auto}
  a.link:hover{color:var(--acc)}
  main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 41px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg)}
  aside .panel{padding:14px;border-bottom:1px solid var(--line)}
  aside h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  select,button.primary{width:100%;background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
  button.primary{cursor:pointer;margin-top:8px;background:#1f6feb;border-color:#1f6feb;font-weight:600}
  button.primary:disabled{opacity:.5;cursor:default}
  .hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
  .run-item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .run-item:hover{background:var(--bg2)}
  .run-item.active{background:var(--bg3);border-left:2px solid var(--acc)}
  .run-item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .run-item .pipeline{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run-item .meta{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #detail{overflow-y:auto;padding:16px 20px}
  #detail .dhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  #detail .dhead h2{margin:0;font-size:16px}
  #detail .dhead .sub{color:var(--dim);font-family:var(--mono);font-size:12px}
  .btn{background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--acc)}
  .cols{display:grid;grid-template-columns:1fr 42%;gap:16px;align-items:start}
  @media(max-width:1100px){.cols{grid-template-columns:1fr}}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h3{margin:0;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .tl{padding:8px 0;max-height:640px;overflow-y:auto}
  .tl .ev{display:flex;gap:10px;padding:3px 14px;font-family:var(--mono);font-size:12px;line-height:1.5;align-items:baseline}
  .tl .ev .t{color:var(--dim);flex-shrink:0}
  .tl .ev.ok .m{color:var(--ok)} .tl .ev.err .m{color:var(--err)} .tl .ev.skip .m{color:var(--skip)}
  .tl .ev.run .m{color:var(--acc)} .tl .ev.par .m{color:var(--par)}
  .tl .ev.dim .m{color:var(--dim)}
  .tl .item{border-left:2px solid var(--line);margin:8px 10px 4px 26px;padding-left:10px}
  .tl .par{border:1px dashed rgba(188,140,255,.5);border-radius:8px;margin:6px 10px;padding:4px 0}
  .tl .item .hd,.tl .par .hd{padding:2px 10px;color:var(--dim);font-size:11px}
  .tl .ev .x{color:var(--dim);font-size:11px}
  .rtabs{display:flex;gap:2px}
  .rtabs button{background:none;border:none;color:var(--dim);padding:6px 10px;cursor:pointer;font-size:11px;border-bottom:2px solid transparent}
  .rtabs button.active{color:var(--tx);border-bottom-color:var(--acc)}
  .ctx{padding:10px 14px;max-height:640px;overflow:auto;font-family:var(--mono);font-size:12px}
  .ctx details{margin:2px 0}
  .ctx summary{cursor:pointer;color:var(--acc)}
  .ctx .k{color:var(--acc)} .ctx .s{color:var(--ok)} .ctx .n{color:var(--skip)} .ctx .b{color:var(--par)} .ctx .m{color:var(--dim)}
  .jnl{padding:10px 14px;background:#0a0d12;font-family:var(--mono);font-size:11.5px;line-height:1.55;max-height:640px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
  .jnl .ln{color:#c9d1d9}
  .jnl .ln .ts{color:#484f58}
  .jnl .ln.hi{background:rgba(88,166,255,.08)}
  .autochip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:1px 7px;cursor:pointer;margin-left:8px}
  .autochip.on{color:var(--acc);border-color:var(--acc)}
  /* pipelines */
  .plist{padding:6px}
  .pitem{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .pitem:hover{background:var(--bg2)}
  .pitem.active{background:var(--bg3)}
  .pitem small{color:var(--dim);font-family:var(--mono)}
  #pdetail{padding:16px;overflow-y:auto}
  #pdetail pre.yaml{background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;overflow:auto;max-height:300px}
  #dag{width:100%;min-height:340px;background:#0a0d12;border:1px solid var(--line);border-radius:8px}
  .dagnode{fill:var(--bg3);stroke:var(--line);stroke-width:1}
  .dagnode.pre{stroke:#8b949e}.dagnode.foreach{stroke:var(--acc)}.dagnode.post{stroke:var(--ok)}
  .daggrp{fill:rgba(188,140,255,.06);stroke:var(--par);stroke-dasharray:5 4;stroke-width:1}
  .dagtxt{fill:var(--tx);font-size:12px;font-family:var(--mono)}
  .dagtxt.dim{fill:var(--dim);font-size:10px}
  .dagtxt.acc{fill:var(--acc);font-size:10px}
  .dagtxt.par{fill:var(--par);font-size:10px}
  .dagedge{stroke:#484f58;stroke-width:1.3;fill:none}
  .empty{color:var(--dim);padding:40px;text-align:center;font-size:13px}
  /* v0.24: гейт-карточка */
  #gate-card{background:var(--bg2);border:1px solid var(--acc);border-radius:10px;margin-bottom:16px;padding:14px 16px;box-shadow:0 0 0 3px rgba(88,166,255,.12)}
  #gate-card h3{margin:0 0 10px;font-size:13px;color:var(--acc)}
  #gate-card .gfield{margin:8px 0}
  #gate-card .gfield label{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:3px}
  #gate-card .gfield input{width:100%;background:#0a0d12;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px}
  #gate-card .gfield input[readonly]{color:var(--dim);background:var(--bg3)}
  #gate-card .gactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  #gate-card .gactions button{background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px}
  #gate-card .gactions button:hover{border-color:var(--acc)}
  #gate-card .gactions button.ok:hover{border-color:var(--ok);color:var(--ok)}
  #gate-card .gactions button.err:hover{border-color:var(--err);color:var(--err)}
  #gate-card .gstatus{font-size:12px;color:var(--dim);margin-top:10px}
  #gate-card .gstatus.error{color:var(--err)}
</style>
</head>
<body>
<header>
  <h1><span class="dot">●</span> orchestrator · консоль</h1>
  <span id="ver" class="badge">…</span>
  <nav>
    <button id="tab-runs" class="active">Раны</button>
    <button id="tab-pipelines">Пайплайны</button>
  </nav>
</header>

<main>
  <!-- RUNS -->
  <aside id="runs-aside">
    <div class="panel">
      <h3>Новый ран</h3>
      <select id="run-select"></select>
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin-top:8px;cursor:pointer">
        <input type="checkbox" id="run-gate" checked style="width:auto"/>
        человек в гейте — в браузере
      </label>
      <button id="run-btn" class="primary">Запустить</button>
      <div class="hint">Гейт: ран ждёт, решение — кнопкой прямо в консоли (v0.24).
      Без галочки — <b>--yes</b>: гейты авто-приняты. Один ран за раз.</div>
      <div id="run-status" class="hint"></div>
    </div>
    <div class="panel" style="border-bottom:none">
      <h3>Раны <span id="runs-count" style="text-transform:none"></span></h3>
      <div id="runs-list"><div class="empty">загрузка…</div></div>
    </div>
  </aside>
  <div id="detail"><div class="empty">Выбери ран слева — таймлайн, контекст и live-журнал появятся здесь</div></div>

  <!-- PIPELINES (скрыт) -->
  <aside id="pip-aside" style="display:none">
    <div class="panel" style="border-bottom:none">
      <h3>Пайплайны <span id="pip-count" style="text-transform:none"></span></h3>
      <div class="plist" id="pip-list"></div>
    </div>
  </aside>
  <div id="pdetail" style="display:none"><div class="empty">Выбери пайплайн</div></div>
</main>
<script src="/app.js"></script>
</body>
</html>
