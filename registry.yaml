# registry v0.1 — формат заморожен (как протокол).
#
# Reестр живёт здесь (корень репо wedra) — минимальная конфигурация:
# один репо = реестр + источник плагинов/пресетов. Когда появится
# отдельное комьюнити, реестр выносится в свой репо — формат не меняется.
#
# Установка:
#   wedra plugin install <name>[@version]
#   wedra pipeline install <name>          # + автоустановка плагинов
#
# Поля записи:
#   source      — git-репо, где лежит плагин/пресет (или локальный путь)
#   path        — подпуть: плагин — каталог, пресет — файл .yaml
#   version     — тег/ветка источника (дефолт main); pinнинг — `name@version` в пайплайне
#   commit      — v0.28a (уточнено v0.29): полный SHA проверенного содержимого.
#                 install тянет РОВНО этот SHA (git fetch <sha>), тег не в
#                 дело: тег сдвинули — ставим зафиксированный контент; SHA
#                 переписали (захват репо) — fetch не найдёт коммит → fail-closed
#   description — человекочитаемое
#
# Дисциплина: version/commit в записях — pin источника, а не версия продукта.
# При релизе продукта обновляйте их только вместе с новым проверенным содержимым;
# product version и protocol version живут в VERSION и protocol/VERSION.

